x-api: &api
  build: ./app/api
  image: campushub-api:1.0
  env_file: .env
  restart: unless-stopped
  networks: [backend, data]
  depends_on:
    db:       { condition: service_healthy }
    redis:    { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
    minio:    { condition: service_healthy }

services:
  gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports: ["${GATEWAY_PORT}:8080"]
    volumes: ["./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    networks: [frontend, backend]
    depends_on:
      frontend: { condition: service_healthy }
      api:      { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 15s
      retries: 5
    deploy: { resources: { limits: { cpus: "0.25", memory: 128M } } }

  frontend:
    build: ./app/frontend
    image: campushub-frontend:1.0
    networks: [frontend]
    restart: unless-stopped
    deploy: { resources: { limits: { cpus: "0.25", memory: 128M } } }

  api:
    <<: *api
    deploy: { resources: { limits: { cpus: "0.5", memory: 256M } } }

  worker:
    <<: *api
    command: node src/worker.js
    healthcheck: { disable: true }
    deploy: { resources: { limits: { cpus: "0.5", memory: 256M } } }

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 15
    deploy: { resources: { limits: { cpus: "0.5", memory: 256M } } }

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      retries: 15
    deploy: { resources: { limits: { cpus: "0.25", memory: 128M } } }

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports: ["127.0.0.1:15672:15672"]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 15
    deploy: { resources: { limits: { cpus: "0.5", memory: 384M } } }

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    ports: ["127.0.0.1:9001:9001"]
    volumes: ["miniodata:/data"]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 15
    deploy: { resources: { limits: { cpus: "0.5", memory: 256M } } }

  mailhog:
    image: mailhog/mailhog
    ports: ["127.0.0.1:8025:8025"]
    networks: [backend]
    restart: unless-stopped
    deploy: { resources: { limits: { cpus: "0.25", memory: 64M } } }

networks:
  frontend:
  backend:
  data:
    internal: true

volumes:
  pgdata:
  miniodata: